spring.application.name=RepoMind

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/RepoMind}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-4o-mini
spring.ai.openai.embedding.model=text-embedding-3-small

#Github OAuth2
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23liPWJl45xmZawhdK}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:a5c6223ec0c0e744d8747367b48cd0a8cbde62fc}
spring.security.oauth2.client.registration.github.scope=read:user,repo
spring.security.oauth2.client.provider.github.user-name-attribute=id

#PgVec

server.servlet.session.cookie.name=REPOMIND_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

#App settings
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.token-encryptor-password=${TOKEN_ENCRYPTOR_PASSWORD:repomind-local-encrypt-key}
app.token-encryptor-salt=${TOKEN_ENCRYPTOR_SALT:5c0744940b5c369b}
app.indexing.max-file-bytes=102400
app.indexing.chunk-size=800
app.indexing.chunk-overlap=100
app.github.api-delay-ms=50
